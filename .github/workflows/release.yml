name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '作成するタグ名 (例: v1.0.0)'
        required: true

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_name: windows
          - runner: ubuntu-latest
            os_name: linux
          - runner: macos-latest
            os_name: macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # checkout v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # setup-node v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # upload-artifact v7.0.0
        with:
          name: dist-${{ matrix.os_name }}
          path: |
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # checkout v6.0.2
        with:
          fetch-depth: 0 # 一旦、履歴をすべて取得する

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # download-artifact v8.0.1
        with:
          path: release-assets

      - name: Show downloaded files
        run: find release-assets -type f | sort

      - name: Fetch Latest Merged PR Information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 最新のマージ済みPRのタイトルと本文を取得して書き出す
          # 最新の1件を取得
          gh pr list --state merged --base Release --limit 1 --json title,body --template \
          '{{ range . }}# {{ .title }}{{ "\n\n" }}{{ .body }}{{ end }}' > release_notes.md

      - name: Collect release assets
        shell: bash
        run: |
          mapfile -t assets < <(
            find release-assets -type f \( -name '*.zip' -o -name '*.AppImage' \) | sort
          )
              
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
              
          printf '%s\n' "${assets[@]}" > asset_list.txt
          printf '%s\n' "${assets[@]}"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        shell: bash
        run: |
          mapfile -t assets < asset_list.txt
        
          gh release create "$TAG_NAME" \
            --verify-tag \
            --title "Release $TAG_NAME" \
            --notes-file release_notes.md \
            --draft \
            "${assets[@]}"
